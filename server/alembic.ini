# پیکربندی Alembic — مهاجرت‌های دیتابیس «بدنه»
# آدرس دیتابیس عمداً اینجا خالی است: در migrations/env.py از DATABASE_URL (env) خوانده می‌شود
# تا هیچ اطلاعات اتصالی داخل گیت نرود.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# خالی بماند — مقدار واقعی از app.config.Settings (DATABASE_URL) می‌آید
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
