# Badane CI v10 - Java 17 + universal debug APK artifact
# تاریخ: 2026-08-11

name: Badane CI

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: pytest -q

  flutter:
    name: Flutter (analyze + test + debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run Flutter analysis
        run: flutter analyze

      - name: Run Flutter tests
        run: |
          set -o pipefail
          flutter test --coverage 2>&1 | tee test.log

      - name: Build universal debug APK
        run: |
          set -o pipefail
          flutter build apk --debug --verbose 2>&1 | tee build.log

      - name: Check build output
        run: |
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          echo "APK built successfully: $APK"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: badane-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-logs
          path: |
            app/test.log
            app/build.log
          if-no-files-found: warn
          retention-days: 7
