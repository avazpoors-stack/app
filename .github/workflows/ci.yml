name: CI

on:
  push:
  pull_request:

jobs:
  flutter:
    name: Flutter (analyze + test + APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: دریافت وابستگی‌ها
        run: flutter pub get
      - name: تحلیل استاتیک
        run: flutter analyze
      - name: تست‌ها
        run: flutter test
      - name: بیلد APK دیباگ
        run: flutter build apk --debug
      - name: گزارش حجم APK
        run: |
          SIZE=$(stat -c%s build/app/outputs/flutter-apk/app-debug.apk)
          echo "APK size: $SIZE bytes ($((SIZE / 1024 / 1024)) MB)"
          test "$SIZE" -lt 104857600 && echo "OK (< 100MB)"
      - name: آپلود APK
        uses: actions/upload-artifact@v4
        with:
          name: badane-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

  server:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: نصب وابستگی‌ها
        run: pip install -r requirements.txt
      - name: تست‌ها
        run: pytest -q
