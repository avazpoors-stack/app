# Badane CI - نسخه 3 - فیکس analyze که روی warning هم fail می‌کرد
# بر اساس تحقیق: flutter analyze حتی روی info هم exit 1 می‌دهد مگر با --no-fatal-infos --no-fatal-warnings
# تاریخ: 2026-08-11

name: Badane CI

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: pytest -q

  flutter:
    name: Flutter (analyze + test + debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: |
          flutter --version
          dart --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter app
        run: |
          echo "Running flutter analyze with no-fatal flags (fixes info/warning failure)"
          flutter analyze --no-fatal-infos --no-fatal-warnings --verbose 2>&1 | tee analyze.log || true
          echo "--- analyze.log tail ---"
          tail -n 100 analyze.log || true
          # فقط اگر error واقعی باشد فیل کن، نه info/warning
          if grep -E "error •" analyze.log; then
            echo "❌ Found real errors in analyze"
            exit 1
          else
            echo "✅ Analyze passed (infos/warnings allowed)"
          fi

      - name: Run Flutter tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Report APK size
        run: |
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes ($((SIZE / 1024 / 1024)) MB)"
          test "$SIZE" -lt 104857600

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: badane-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload analyze log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-log
          path: app/analyze.log
