# Badane CI v4 - با لاگ‌گیری برای دیباگ بدون نیاز به دانلود artifact
# تاریخ: 2026-08-11

name: Badane CI

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: pytest -q

  flutter:
    name: Flutter (analyze + test + debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter app (with log capture)
        id: analyze
        run: |
          echo "=== flutter analyze ==="
          set +e
          flutter analyze --verbose 2>&1 | tee analyze.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "--- analyze.log (first 200 lines) ---"
          head -n 200 analyze.log || true
          echo "--- errors only ---"
          grep -E "error •|warning •|info •" analyze.log | head -n 100 || true
          echo "EXIT_CODE=$EXIT_CODE"
          # ذخیره برای step بعدی
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          # حتی اگر warning داشته باشد، اگر error واقعی بود fail کن
          if grep -q "error •" analyze.log; then
            echo "has_error=true" >> $GITHUB_OUTPUT
            echo "❌ Real errors found"
            cat analyze.log
            exit 1
          else
            echo "has_error=false" >> $GITHUB_OUTPUT
            echo "✅ No real errors (only warnings/infos)"
          fi

      - name: Create issue with analyze log on failure
        if: failure() && steps.analyze.outputs.has_error == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('analyze.log', 'utf8').substring(0, 60000);
            } catch(e) {
              log = 'Could not read analyze.log: ' + e.message;
            }
            const body = `### Flutter analyze failed\n\n\`\`\`\n${log}\n\`\`\`\n\n**Branch:** ${context.ref}\n**Commit:** ${context.sha}\n**Run:** ${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Flutter analyze error on ${context.ref}`,
              body: body,
              labels: ['ci', 'bug']
            });

      - name: Run Flutter tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Report APK size
        run: |
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes ($((SIZE / 1024 / 1024)) MB)"
          test "$SIZE" -lt 104857600

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: badane-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
