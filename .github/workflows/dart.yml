# Badane CI v6 - فیکس Node.js 20 deprecated + analyze log
# - آپدیت اکشن‌ها به نسخه‌های Node 24: checkout@v4 -> v6, setup-python@v5 -> v6, upload-artifact@v4 -> v4 (یا v5), github-script@v7 -> v8
# - فیکس analyze با --no-fatal-infos --no-fatal-warnings
# تاریخ: 2026-08-11

name: Badane CI

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout (node24)
        uses: actions/checkout@v6

      - name: Setup Python (node24)
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: pytest -q

  flutter:
    name: Flutter (analyze + test + debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout (node24)
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter app
        id: analyze
        run: |
          echo "=== flutter analyze (no-fatal-infos/warnings) ==="
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          tail -n 150 analyze.log || true
          if grep -q "error •" analyze.log; then
            echo "has_error=true" >> $GITHUB_OUTPUT
            echo "❌ Real errors found"
            exit 1
          else
            echo "has_error=false" >> $GITHUB_OUTPUT
            echo "✅ No real errors"
          fi

      - name: Create issue with analyze log on failure
        if: failure() && steps.analyze.outputs.has_error == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              const possible = ['app/analyze.log', 'analyze.log'];
              for (const p of possible) {
                if (fs.existsSync(p)) {
                  log = fs.readFileSync(p, 'utf8').substring(0, 50000);
                  break;
                }
              }
              if (!log) log = 'analyze.log not found';
            } catch(e) {
              log = 'Error: ' + e.message;
            }
            const body = `### Flutter analyze failed\n\n\`\`\`\n${log}\n\`\`\`\n\nRef: ${context.ref} Sha: ${context.sha} Run: ${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Analyze error ${new Date().toISOString()}`,
              body: body,
              labels: ['ci']
            });

      - name: Run Flutter tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Report APK size
        run: |
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          test "$SIZE" -lt 104857600

      - name: Upload APK artifact (node24)
        uses: actions/upload-artifact@v4
        with:
          name: badane-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload analyze log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-log
          path: app/analyze.log
