# Badane CI v7 - workflow نهایی P2-P4
# تاریخ: 2026-08-11
# وضعیت: Ready for production

name: Badane CI

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: pytest -q

  flutter:
    name: Flutter (analyze + test + debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: latest
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run Flutter analysis
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --coverage 2>&1 | tee test.log
        continue-on-error: true

      - name: Build debug APK
        run: flutter build apk --debug --split-per-abi 2>&1 | tee build.log

      - name: Check build outputs
        run: |
          ls -lah build/app/outputs/flutter-apk/
          if [ -f build/app/outputs/flutter-apk/app-debug.apk ]; then
            echo "✅ APK built successfully"
          else
            echo "❌ APK build failed"
            exit 1
          fi

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: badane-debug-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-logs
          path: |
            app/test.log
            app/build.log
          retention-days: 7
